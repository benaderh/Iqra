name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download ONNX model from Hugging Face
        run: |
          mkdir -p assets/model
          curl -L "https://huggingface.co/Tidzo/darten-zipformer-quran/resolve/main/zipformer_p_arabic_v3.int8.onnx" \
            -o assets/model/zipformer_p_arabic_v3.int8.onnx
          echo "Model size: $(du -sh assets/model/zipformer_p_arabic_v3.int8.onnx)"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK split par architecture
        run: flutter build apk --debug --split-per-abi --android-skip-build-dependency-validation

      - name: Afficher la taille des APKs
        run: |
          echo "=== Taille des APKs générés ==="
          du -sh build/app/outputs/flutter-apk/*.apk

      - name: Upload APK arm64 (téléphones modernes)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 30

      - name: Upload APK armeabi-v7a (anciens téléphones)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-armeabi-v7a
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-debug.apk
          retention-days: 30
