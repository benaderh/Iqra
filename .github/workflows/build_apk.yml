name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APKs (Online AI Model Download)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split Release APKs (~30 MB)
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Build Universal Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Afficher la taille des APKs
        run: |
          echo "=== Tailles des APKs générés ==="
          ls -lh build/app/outputs/flutter-apk/app-*.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: iqra-release-apks
          path: build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30
