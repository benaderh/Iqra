name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK (single, online mode)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Download ONNX model from Hugging Face
        run: |
          mkdir -p assets/model
          curl -L "https://huggingface.co/Tidzo/darten-zipformer-quran/resolve/main/zipformer_p_arabic_v3.int8.onnx" \
            -o assets/model/zipformer_p_arabic_v3.int8.onnx
          echo "Model size: $(du -sh assets/model/zipformer_p_arabic_v3.int8.onnx)"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (single universal)
        run: flutter build apk --debug --android-skip-build-dependency-validation

      - name: Afficher la taille de l'APK
        run: |
          echo "=== Taille APK ==="
          du -sh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
